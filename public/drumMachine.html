<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <title>Drum Machine</title>
    <script type='text/javascript' src="./drumMachine.js" async></script>
    <style>
        body {
            position: relative;
            padding-top: 50px;
            text-align: center;
            background: #F86;
            width: 50vw;
            margin: 0 auto;
            font-family: 'Arial, Helvetica', sans-serif;
            color: #77ffbb;
            text-shadow: 2px 2px orange;
            user-select: none;
            -moz-user-select: none;
        }

        #drum-machine {
            min-width: 500px;
        }

        #display {
            padding-top: 20px;
            height: 500px;
        }

        .drum-pad {
            vertical-align: text-top;
            width: 50vw;
            height: 8vh;
            border-radius: 10%;
            background: white no-repeat;
            padding: 7%;
            background-size: contain;
            background-position: center;
            margin: 0 auto;
            font-size: 3em;
            opacity: 0.85;
            border: 5px solid #fff;
        }

            .drum-pad:hover {
                opacity: 1;
                border: 5px solid #77ffbb;
                transform: scale(1.1)
            }

        .pressed {
            opacity: 1;
            border: 5px solid #77ffbb;
        }

        #Q {
            background-image: url('https://s3.us-east-2.amazonaws.com/fccprojects2018/drums/images/closedHat.png')
        }

        #W {
            background-image: url('https://s3.us-east-2.amazonaws.com/fccprojects2018/drums/images/openHat.png')
        }

        #E {
            background-image: url('https://image.flaticon.com/icons/png/128/26/26785.png')
        }

        #A {
            background-image: url('https://s3.us-east-2.amazonaws.com/fccprojects2018/drums/images/snare-drum.png')
        }

        #S {
            background-image: url('https://s3.us-east-2.amazonaws.com/fccprojects2018/drums/images/tuba1.png');
        }


        #D {
            background-image: url('https://s3.us-east-2.amazonaws.com/fccprojects2018/drums/images/trumpet1.png')
        }

        #Z {
            background-image: url('https://s3.us-east-2.amazonaws.com/fccprojects2018/drums/images/bass-drum.png');
        }

        #X {
            background-image: url('https://s3.us-east-2.amazonaws.com/fccprojects2018/drums/images/keysUp.png')
        }

        #C {
            background-image: url('https://s3.us-east-2.amazonaws.com/fccprojects2018/drums/images/keysDown.png')
        }

        #buttonContainer {
            padding: 4%;
        }

        .FX {
            position: relative;
            font-size: 2em;
            border-radius: 5%;
            opacity: 0.8;
        }

            .FX:hover {
                opacity: 1;
                border: 2px solid #77ffbb;
            }

        #soundInfo {
            position: relative;
            width: 100%;
            margin: 0 auto;
            font-size: 4em;
        }

        #removeFX {
            border: 5px solid black;
        }

        .swal-modal {
            text-shadow: none;
        }
    </style>
</head>
    <body id='body'>
        <header id='header'>
            <meta charset='UTF-8'>
            <meta name='author' content='kurt lehnardt'>
        </header>
        <main>
            <div id='drum-machine'>
                <div id='soundInfoContainer'>
                    <span id='soundInfo'>drum machine</span>
                </div>
                <div id='display'>
                    <table>
                        <tr id='row1'>
                            <td id='Q' onclick='Q.stop();Q.play();UPDATE_TAG("hi hat closed")' class='drum-pad clip'>Q</td>
                            <td id='W' onclick='W.stop();W.play();UPDATE_TAG("hi hat open")' class='drum-pad clip'>W</td>
                            <td id='E' onclick='E.stop();E.play();UPDATE_TAG("crash")' class='drum-pad clip'>E</td>
                        </tr>
                        <tr id='row2'>

                            <td id='A' onclick='A.stop();A.play();UPDATE_TAG("snare")' class='drum-pad clip'>A</td>
                            <td id='S' onclick='S.stop();S.play();UPDATE_TAG("trombone")' class='drum-pad clip'>S</td>
                            <td id='D' onclick='D.stop();D.play();UPDATE_TAG("trumpet")' class='drum-pad clip'>D</td>
                        </tr>
                        <tr id='row3'>
                            <td id='Z' onclick='Z.stop();Z.play();UPDATE_TAG("bass kick")' class='drum-pad clip'>Z</td>
                            <td id='X' onclick='X.stop();X.play();UPDATE_TAG("keyboard up")' class='drum-pad clip'>X</td>
                            <td id='C' onclick='C.stop();C.play();UPDATE_TAG("keyboard down")' class='drum-pad clip'>C</td>
                        </tr>
                    </table>
                    <div id='buttonContainer'>
                        <button class='FX' onclick='GROUP.removeEffect(DELAY);GROUP.addEffect(DELAY)'>Delay</button>
                        <button class='FX' onclick='GROUP.removeEffect(REVERB);GROUP.addEffect(REVERB)'>Reverb</button>
                        <button class='FX' onclick='GROUP.removeEffect(DISTORTION);GROUP.addEffect(DISTORTION)'>Distortion</button>
                        <button class='FX' onclick='GROUP.removeEffect(HP);GROUP.addEffect(HP)'>HiPass</button>
                        <button class='FX' onclick='GROUP.removeEffect(LP);GROUP.addEffect(LP)'>LoPass</button>
                        <button class='FX' onclick='GROUP.removeEffect(PANNER);GROUP.addEffect(PANNER)'>Pan</button>
                        <button class='FX' onclick='GROUP.removeEffect(FLANGER);GROUP.addEffect(FLANGER)'>Flanger</button>

                    </div>
                    <button id='removeFX' class='FX' onClick="removeFX()">Remove FX</button>

                </div>
            </div>
        </main>

</body>


</html>
