<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <title>Drum Machine</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pizzicato/0.6.4/Pizzicato.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sweetalert/2.1.2/sweetalert.min.js"></script>
   <!-- <script type='text/javascript' src="./drumMachine.js" async></script> -->
    <script>
        // JavaScript source code

        // TODO change 'remove FX' button so that each FX button toggles itself on/off,
        //
        // e.g.  !sound.addEffect('${effect}') ? sound.addEffect('${effect}') : sound.removeEffect('${effect}')
        // or 'let active = false', onButtonPress(effect) { if (active) { removeEffect(etc... )} }


        const removeFX = () => {
            GROUP.removeEffect(DELAY)
                .removeEffect(REVERB)
                .removeEffect(DISTORTION)
                .removeEffect(FLANGER)
                .removeEffect(PANNER)
                .removeEffect(HP)
                .removeEffect(LP)
                .removeEffect(TREMOLO)
        };

        const UPDATE_TAG = msg => {
            document.getElementById("soundInfo").innerHTML = msg;
        };

        //SOURCES FOR SOUND FILES
        const URL = "https://s3-us-west-2.amazonaws.com/s.cdpn.io/377560/",
            Q = new Pz.Sound(`${URL}open.WAV`),
            W = new Pz.Sound('https://s3.eu-west-2.amazonaws.com/jamesmaltby/codepen/audio/hihatopen.mp3'),
            E = new Pz.Sound('https://s3.eu-west-2.amazonaws.com/jamesmaltby/codepen/audio/crash.mp3'),
            A = new Pz.Sound(`${URL}snare.WAV`),
            S = new Pz.Sound(`${URL}PAD2.wav`),
            D = new Pz.Sound(`${URL}HORN1.wav`),
            Z = new Pz.Sound(`${URL}kick.WAV`),
            X = new Pz.Sound(`${URL}chord1.wav`),
            C = new Pz.Sound(`${URL}chord2.wav`);

        const GROUP = new Pz.Group([Q, W, E, A, S, D, Z, X, C]);

        //FX
        const DELAY = new Pizzicato.Effects.Delay({
            feedback: 0.4,
            time: 0.4,
            mix: 0.5
        }),
            DISTORTION = new Pizzicato.Effects.Distortion({
                gain: 0.3
            }),
            REVERB = new Pz.Effects.Reverb({
                time: 1,
                decay: 0.8,
                reverse: false,
                mix: 0.5
            }),
            FLANGER = new Pz.Effects.Flanger({
                time: 0.45,
                speed: 0.2,
                depth: 0.1,
                feedback: 0.1,
                mix: 0.5
            }),
            TREMOLO = new Pz.Effects.Tremolo({
                speed: 5,
                depth: 1,
                mix: 0.5
            }),
            PANNER = new Pz.Effects.StereoPanner({
                pan: 0.5
            }),
            LP = new Pz.Effects.LowPassFilter({
                frequency: 1000,
                peak: 10
            }),
            HP = new Pz.Effects.HighPassFilter({
                frequency: 100,
                peak: 10
            });

        // TODO Bool for FX cause audio error when attempt to remove.
        // ADD FX KEY BINDINGS e.g. U, I, O, etc...
        // HAVE KEYPRESSES HIGHLIGH BUTTONS ON PAD
        //
        $(".drum-pad").keydown(e => {
            // Sets the color when the key is down...
            $(e).toggleClass("pressed");
        });

        document.onkeydown = function (e) {
            const key = e.which || e.keyCode;
            // const clip = String.fromCharCode(key)
            // clip.stop()
            // clip.play()

            // TODO change the switch statement to a function that takes the key value, then calls .play() and .stop() on the sound associated with the value
            switch (key) {
                case 37: // left arrow - filter / fx / pitch shift up
                    GROUP.removeEffect(DELAY);
                    GROUP.addEffect(DELAY);
                    break;
                case 38: // up arrow - volume / filter up
                    GROUP.volume += 0.1;
                    break;
                case 39: // right arrow fx down
                    GROUP.removeEffect(REVERB);
                    GROUP.addEffect(REVERB);
                    break;
                case 40: // down arrow volume / filter down
                    GROUP.volume -= 0.1;
                    break;
                case 81:
                    Q.stop();
                    Q.play();
                    UPDATE_TAG("hi hat closed");
                    $("#Q").toggleClass(pressed, addOrRemove);

                    break;
                case 87: // w
                    W.stop();
                    W.play();
                    UPDATE_TAG("hi hat open");
                    break;
                case 69: // e
                    E.stop();
                    E.play();
                    UPDATE_TAG("hi hat");
                    break;
                case 65: //a
                    A.stop();
                    A.play();
                    UPDATE_TAG("snare");
                    break;
                case 83: //s
                    S.stop();
                    S.play();
                    UPDATE_TAG("trombone");
                    break;
                case 68: //d
                    D.stop();
                    D.play();
                    UPDATE_TAG("trumpet");
                    break;
                case 90: //z
                    Z.stop();
                    Z.play();
                    UPDATE_TAG("bass kick");
                    break;
                case 88: //x
                    X.stop();
                    X.play();
                    UPDATE_TAG("keys up");
                    break;
                case 67: //c
                    C.stop();
                    C.play();
                    UPDATE_TAG("keys down");
                    break;
                default:
                    return null; // exit this handler for other keys
            }
            e.preventDefault(); // prevent the default action (scroll / move caret)
        };

        // TODO SEPARATE OUT COMPONENTS AND MOVE HTML FORMATTING INTO THEM

        swal("Up/Down arrow for volume \n Left/Right arrow for delay/reverb ", {
            buttons: true,
            timer: 2500,
            closeOnEsc: true,
            closeOnClickOutside: true
        });
    </script>
    <style>
        body {
            position: relative;
            padding-top: 50px;
            text-align: center;
            background: #F86;
            width: 50vw;
            margin: 0 auto;
            font-family: 'Arial, Helvetica', sans-serif;
            color: #77ffbb;
            text-shadow: 2px 2px orange;
            user-select: none;
            -moz-user-select: none;
        }

        #drum-machine {
            min-width: 500px;
        }

        #display {
            padding-top: 20px;
            height: 500px;
        }

        .drum-pad {
            vertical-align: text-top;
            width: 50vw;
            height: 8vh;
            border-radius: 10%;
            background: white no-repeat;
            padding: 7%;
            background-size: contain;
            background-position: center;
            margin: 0 auto;
            font-size: 3em;
            opacity: 0.85;
            border: 5px solid #fff;
        }

            .drum-pad:hover {
                opacity: 1;
                border: 5px solid #77ffbb;
                transform: scale(1.1)
            }

        .pressed {
            opacity: 1;
            border: 5px solid #77ffbb;
        }

        #Q {
            background-image: url('https://s3.us-east-2.amazonaws.com/fccprojects2018/drums/images/closedHat.png')
        }

        #W {
            background-image: url('https://s3.us-east-2.amazonaws.com/fccprojects2018/drums/images/openHat.png')
        }

        #E {
            background-image: url('https://image.flaticon.com/icons/png/128/26/26785.png')
        }

        #A {
            background-image: url('https://s3.us-east-2.amazonaws.com/fccprojects2018/drums/images/snare-drum.png')
        }

        #S {
            background-image: url('https://s3.us-east-2.amazonaws.com/fccprojects2018/drums/images/tuba1.png');
        }


        #D {
            background-image: url('https://s3.us-east-2.amazonaws.com/fccprojects2018/drums/images/trumpet1.png')
        }

        #Z {
            background-image: url('https://s3.us-east-2.amazonaws.com/fccprojects2018/drums/images/bass-drum.png');
        }

        #X {
            background-image: url('https://s3.us-east-2.amazonaws.com/fccprojects2018/drums/images/keysUp.png')
        }

        #C {
            background-image: url('https://s3.us-east-2.amazonaws.com/fccprojects2018/drums/images/keysDown.png')
        }

        #buttonContainer {
            padding: 4%;
        }

        .FX {
            position: relative;
            font-size: 2em;
            border-radius: 5%;
            opacity: 0.8;
        }

            .FX:hover {
                opacity: 1;
                border: 2px solid #77ffbb;
            }

        #soundInfo {
            position: relative;
            width: 100%;
            margin: 0 auto;
            font-size: 4em;
        }

        #removeFX {
            border: 5px solid black;
        }

        .swal-modal {
            text-shadow: none;
        }
    </style>
</head>
    <body id='body'>
        <header id='header'>
            <meta charset='UTF-8'>
            <meta name='author' content='kurt lehnardt'>
        </header>
        <main>
            <div id='drum-machine'>
                <div id='soundInfoContainer'>
                    <span id='soundInfo'>drum machine</span>
                </div>
                <div id='display'>
                    <table>
                        <tr id='row1'>
                            <td id='Q' onclick='Q.stop();Q.play();UPDATE_TAG("hi hat closed")' class='drum-pad clip'>Q</td>
                            <td id='W' onclick='W.stop();W.play();UPDATE_TAG("hi hat open")' class='drum-pad clip'>W</td>
                            <td id='E' onclick='E.stop();E.play();UPDATE_TAG("crash")' class='drum-pad clip'>E</td>
                        </tr>
                        <tr id='row2'>

                            <td id='A' onclick='A.stop();A.play();UPDATE_TAG("snare")' class='drum-pad clip'>A</td>
                            <td id='S' onclick='S.stop();S.play();UPDATE_TAG("trombone")' class='drum-pad clip'>S</td>
                            <td id='D' onclick='D.stop();D.play();UPDATE_TAG("trumpet")' class='drum-pad clip'>D</td>
                        </tr>
                        <tr id='row3'>
                            <td id='Z' onclick='Z.stop();Z.play();UPDATE_TAG("bass kick")' class='drum-pad clip'>Z</td>
                            <td id='X' onclick='X.stop();X.play();UPDATE_TAG("keyboard up")' class='drum-pad clip'>X</td>
                            <td id='C' onclick='C.stop();C.play();UPDATE_TAG("keyboard down")' class='drum-pad clip'>C</td>
                        </tr>
                    </table>
                    <div id='buttonContainer'>
                        <button class='FX' onclick='GROUP.removeEffect(DELAY);GROUP.addEffect(DELAY)'>Delay</button>
                        <button class='FX' onclick='GROUP.removeEffect(REVERB);GROUP.addEffect(REVERB)'>Reverb</button>
                        <button class='FX' onclick='GROUP.removeEffect(DISTORTION);GROUP.addEffect(DISTORTION)'>Distortion</button>
                        <button class='FX' onclick='GROUP.removeEffect(HP);GROUP.addEffect(HP)'>HiPass</button>
                        <button class='FX' onclick='GROUP.removeEffect(LP);GROUP.addEffect(LP)'>LoPass</button>
                        <button class='FX' onclick='GROUP.removeEffect(PANNER);GROUP.addEffect(PANNER)'>Pan</button>
                        <button class='FX' onclick='GROUP.removeEffect(FLANGER);GROUP.addEffect(FLANGER)'>Flanger</button>

                    </div>
                    <button id='removeFX' class='FX' onClick="removeFX()">Remove FX</button>

                </div>
            </div>
        </main>

</body>


</html>
