<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <title>Click Counter</title>
    <style>
        body {
            background: linear-gradient(#e5a491, #9198e5) no-repeat;
            height: 100vh;
            color: #DDD;
            text-align: center;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        }

        #buttonHolder {
            margin: 0 auto;
        }

        #clicker {
            margin: 0 auto;
            width: 350px;
            height: 200px;
            background-image: url('https://s3-us-west-2.amazonaws.com/trailerments/score-keeper/buttonUp.png');
            background-size: cover;
            background-position: center;
        }

            #clicker:active {
                background-image: url('https://s3-us-west-2.amazonaws.com/trailerments/score-keeper/buttonDown.png');
                background-size: cover;
                background-position: center;
            }
    </style>
</head>
<body>
    <h1>How fast can you click?</h1>
    <div id="buttonHolder">
        <div id="clicker" onclick="increment()"></div>
        <p>
            You've clicked <span id="counter">0</span> times!<br />
        </p>
        <p> That's <span id="pressPerSecond">0</span> presses per second!</p>
        <br />
        <button onclick="restart()">Restart</button><br />
        <button onclick='submit();startTimer()'>Submit score</button><br />
        <a href='/auth/logout'>Logout</a>
    </div>
</body>
<script>
    let score = 0;
    let time = 0;
    function increment() {
        score += 1;
        document.getElementById('counter').innerHTML = score;
    }
    function submit() {
        let highScore = document.getElementById('pressPerSecond').innerHTML;
        alert(highScore);
    }
    function startTimer(event) {
        let time = document.getElementById("time");
        let seconds = (event.timeStamp / 1000).toFixed(2);
        let pressPerSecond = (score / seconds).toFixed(2)
        document.getElementById('pressPerSecond').innerHTML = pressPerSecond;
        return pressPerSecond;
    }
    document.body.addEventListener("click", startTimer);

    function restart() {
        location.reload();
    }
