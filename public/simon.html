<!doctype html>
<html>
<head>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
    <meta charset='UTF-8'>
    <meta name="authors" content="Kurt Lehnardt, Russell Murray">
    <script type='text/javascript' src='./simon.js'></script>
    <link rel='stylesheet' type='text/css' href='simon.css'>


</head>
<body>
    <span id=output></span>

    <div id='app'>
        <div id='gamepad'>
            <div id='blue' class="pad blue" onclick='pressColor(0)'></div>
            <div id='green' class="pad green" onclick='pressColor(1)'></div>
            <div id='red' class="pad red" onclick='pressColor(2)'></div>
            <div id='yellow' class="pad yellow" onclick='pressColor(3)'></div>
            <div class='center'>
                <div id='title'>
                    <p id='simonText'>SIMON</p>
                </div>

                <div id="turnCount"></div>
                <div class='clear'></div>

                <a id='strictMode' class='buttons' onclick='toggleStrict()'><span class='buttonLabels' id='hard'>HARD</span></a>

                <a id='start' onclick='gameStart();toggleOnOff()' class='buttons'><span class='buttonLabels'>START</span></a>
                <span class='buttonLabels' id='difficulty'>DIFFICULTY</span>
                <div class="sliderContainer">
                    <input type="range" min="1" max="3" value="2" class="slider" id="difficulty" oninput='setDifficulty(value)'>
                </div>
            </div>
        </div>
    </div>
    <div>
        <button id="submit" onclick='submit()'>Submit score</button><br />
        <a id="logout" href='/auth/logout'>Logout</a>
    </div>
</body>
</html>
