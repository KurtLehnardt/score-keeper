<!doctype html>
<html>
<head>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/typescript/3.4.3/typescript.min.js"></script>

    <meta charset='UTF-8'>
    <meta name="authors" content="Kurt Lehnardt, Russell Murray">
    <style>
        body {
            background: url("http://images.naldzgraphics.net/2014/08/3-seamless-dark-carpet.jpg");
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        }

        #app {
            position: relative;
            width: 640px;
            margin: 0 auto;
            font-family: helvetica;
            transform: rotate(-5deg);
        }

        #gamepad {
            border-style: solid;
            border-width: 30px;
            border-radius: 50%;
            margin: 0 auto;
            position: absolute;
            top: 50px;
            width: 640px;
            height: 640px;
            background: #000;
            box-shadow: 30px 30px 10px rgba(5,5,5,0.7);
        }

        .pad {
            width: 300px;
            height: 300px;
            float: left;
            margin: 10px;
            -ms-filter: "progid:DXImageTransform.Microsoft.Alpha(Opacity=60)";
            filter: alpha(opacity=60);
        }

        .blue {
            opacity: .4;
            border-top-left-radius: 300px;
            background: radial-gradient(circle farthest-corner at bottom right, white, #004e92, #000428 );
        }

        .green {
            opacity: .4;
            float: left;
            border-top-right-radius: 300px;
            background: radial-gradient(circle farthest-corner at bottom left, white, #52c234, #061711);
            clear: right;
        }

        .red {
            opacity: .4;
            float: left;
            border-bottom-left-radius: 300px;
            background: radial-gradient(circle farthest-corner at top right, white, #ed213a, #63231a);
            clear: left;
        }

        .yellow {
            opacity: .4;
            float: left;
            border-bottom-right-radius: 300px;
            background: radial-gradient(circle farthest-corner at top left, white, #fffd22, #fffc00);
        }

        .center {
            position: absolute;
            top: 175px;
            left: 175px;
            width: 250px;
            height: 250px;
            border-style: solid;
            border-width: 20px;
            border-radius: 50%;
            border-color: #000;
            background: radial-gradient(circle farthest-corner at top right, silver, #444);
        }

        #title {
            height: 120px;
            width: 250px;
            color: #ccc;
            position: absolute;
            top: -1px;
            text-shadow: 1px 1px 1px white;
            font-size: 3.5em;
            border-top: 1px solid #555;
            background: #000;
            border-top-right-radius: 125px;
            border-top-left-radius: 125px;
        }

        #simonText {
            position: absolute;
            left: 32px;
            top: -10px;
            color: silver;
        }

        .buttons {
            user-select: none;
            moz-user-select: none;
            webkit-user-select: none;
        }

        .buttonLabels {
            font-size: .8em;
            position: relative;
            top: -19px;
            color: black;
            text-shadow: 1px 1px grey;
        }

        #hard {
            position: relative;
            left: 5px;
        }

        #start {
            background: radial-gradient(#550, #220);
            position: absolute;
            top: 152px;
            left: 25px;
            width: 35px;
            height: 35px;
            border-style: solid;
            border-width: 2px;
            border-color: #000;
            border-radius: 50%;
        }

            #start:active {
                background: radial-gradient(white, yellow);
            }

        #strictMode {
            position: absolute;
            top: 150px;
            left: 191px;
            background: radial-gradient(blue, black);
            border: solid 2px black;
            border-radius: 50%;
            width: 35px;
            height: 35px;
        }

        #turnCount {
            position: absolute;
            top: 150px;
            left: 75px;
            width: 100px;
            height: 37px;
            border-style: solid;
            border-color: rgba(0,0,0,0.5);
            background-color: rgba(150,0,0,0.3);
            font-size: 1.5em;
            text-align: center;
            color: rgba(250,0,0,0.5);
            text-shadow: 1px 1px 1px #000;
        }

        #difficulty {
            position: relative;
            top: 195px;
            left: 94px;
            z-index: 1;
        }

        .sliderContainer {
            position: relative;
            top: 0px;
            left: -5px;
        }

        .slider {
            border-radius: 10%;
            -webkit-appearance: none; /* Override default CSS styles */
            appearance: none;
            width: 30%; /* Full-width */
            height: 25px; /* Specified height */
            background: #0192ef; /* Grey background */
            outline: none; /* Remove outline */
        }

            .slider::-webkit-slider-thumb {
                -webkit-appearance: none; /* Override default look */
                appearance: none;
                width: 5px; /* Set a specific slider handle width */
                height: 25px; /* Slider handle height */
                background: #004899;
                cursor: pointer; /* Cursor on hover */
            }

            .slider::-moz-range-thumb {
                width: 5px; /* Set a specific slider handle width */
                height: 25px; /* Slider handle height */
                background: #004899; /* Green background */
                cursor: pointer; /* Cursor on hover */
            }

        #submit {
            padding-bottom: 5px;
        }

        #logout {
            position: relative;
            text-decoration: none;
            border: 1px solid black;
            background: #9198e5;
            padding: 1px;
        }
    </style>
    <script>
        let comboMemory: BUTTONCOLOR[] = []
        let userIndex: number = 0
        let playbackID: number
        let userTurn: boolean = false
        let strictMode: boolean = false
        //let onButton:boolean = true
        let turnCount: number = 0
        let turnsToWin: number = 20
        // possibly start turn at 1;
        let blueSound = new Audio("https://s3.amazonaws.com/freecodecamp/simonSound1.mp3")
        let greenSound = new Audio("https://s3.amazonaws.com/freecodecamp/simonSound2.mp3")
        let redSound = new Audio("https://s3.amazonaws.com/freecodecamp/simonSound3.mp3")
        let yellowSound = new Audio("https://s3.amazonaws.com/freecodecamp/simonSound4.mp3")
        let errorSound = new Audio('https://www.freesfx.co.uk/rx2/mp3s/9/11111_1393961399.mp3')
        let winSound = new Audio('http://fcc-zipline-build-a-simon-game.bitballoon.com/assets/media/success.wav')

        function gameStart() {
            //$(".pad").css('opacity', '0.4')
            $(".pad").css('opacity', '0.4')
            $("#turnCount").html('--')
            comboMemory = []
            turnCount = 0
            $('#turnCount').html('--')
            window.clearInterval(playbackID)
            computersTurnNewColor()
        }

        function computersTurnNewColor() {
            newColor()
            computersTurn()
        }

        function newColor() {
            let random: number = Math.floor(Math.random() * (4 - 0) + 0)
            comboMemory.push(random)
            console.log(comboMemory, 'new Color added')
        }

        function computersTurn() {
            userTurn = false
            userIndex = 0
            playColors()
        }

        function playColors() {
            let intervalTime = 1000 - (turnCount * 25)
            console.log(intervalTime, 'interval time')
            console.table('comboMemory length:', comboMemory.length, 'userIndex:', userIndex)
            playbackID = window.setInterval(playNextNumber, intervalTime)
            //https://javascript.info/settimeout-setinterval
        }

        function playNextNumber() {
            console.log('Is this interval?: ')
            playColor(comboMemory[userIndex])
            if (switchTurn()) {
                clearInterval(playbackID)
                userTurn = true
                //userIndex = 0
                turnCount++
            }
        }
        function playColor(color: BUTTONCOLOR) {
            //Consolidate verbose switch statements into this function
            //function light(){$("#" + color)..animate({opacity: 1}, 200).animate({opacity: 0.8}, 100)}
            //if (onButton){
            switch (color) {
                case BUTTONCOLOR.BLUE:
                    resetSound(blueSound)
                    blueSound.play()
                    $("#blue").animate({ opacity: 1 }, 100).animate({ opacity: .4 }, 50)
                    break
                case BUTTONCOLOR.GREEN:
                    resetSound(greenSound)
                    greenSound.play()
                    $("#green").animate({ opacity: 1 }, 100).animate({ opacity: .4 }, 50)
                    break
                case BUTTONCOLOR.RED:
                    resetSound(redSound)
                    redSound.play()
                    $("#red").animate({ opacity: 1 }, 100).animate({ opacity: .4 }, 50)
                    break
                case BUTTONCOLOR.YELLOW:
                    resetSound(yellowSound)
                    yellowSound.play()
                    $("#yellow").animate({ opacity: 1 }, 100).animate({ opacity: .4 }, 50)
                    break
                default:
                    alert('error in playColor switch')
            }
            //  }
            console.log(BUTTONCOLOR[color])
        }
        function switchTurn() {
            return userIndex >= comboMemory.length
        }



        function setDifficulty(value) {
            if (value == 3) {
                turnsToWin = 50
                $('#turnCount').html('Hard: 50')
                console.log(value, turnsToWin)
            } else if (value == 1) {
                turnsToWin = 5
                $('#turnCount').html('Easy: 5')
                console.log(value, turnsToWin)
            }
            else if (value == 2) {
                turnsToWin = 20
                $('#turnCount').html('Reg: 20')
                console.log(value, turnsToWin)
            }
        }

        function gameStop() {
            clearInterval(playbackID)
            comboMemory = []
            userIndex = 0
            userTurn = false
        }

        function resetSound(color) {
            color.currentTime = 0
        }





        function getCombo() {
            return comboMemory
        }








        function pressColor(color: BUTTONCOLOR) {
            //   if (onButton){
            switch (color) {
                case BUTTONCOLOR.BLUE:
                    resetSound(blueSound)
                    blueSound.play()
                    $("#blue").animate({ opacity: 1 }, 100).animate({ opacity: .4 }, 50)
                    break
                case BUTTONCOLOR.GREEN:
                    resetSound(greenSound)
                    greenSound.play()
                    $("#green").animate({ opacity: 1 }, 100).animate({ opacity: .4 }, 50)
                    break
                case BUTTONCOLOR.RED:
                    resetSound(redSound)
                    redSound.play()
                    $("#red").animate({ opacity: 1 }, 100).animate({ opacity: .4 }, 50)
                    break
                case BUTTONCOLOR.YELLOW:
                    resetSound(yellowSound)
                    yellowSound.play()
                    $("#yellow").animate({ opacity: 1 }, 100).animate({ opacity: .4 }, 50)
                    break
                default:
                    alert('error in pressColor switch')
            }
        }
        if (userTurn) {
            if (color == comboMemory[userIndex]) {
                userIndex++
                checkIfTurn()
            } else {
                loseGame()
            }
            // }
        }


        function checkIfWin() {
            if (userIndex == difficultyLevel) {
                $('#turnCount').html('Winner')
                winSound.play()
                gameStop()
                return true
            } else {
                return false
            }
        }

        function checkIfTurn() {
            if (switchTurn()) {
                if (!checkIfWin()) {
                    console.log("your turn is over")
                    $('#turnCount').html(userIndex)
                    computersTurnNewColor()
                }
            }
        }

        function toggleStrict() {
            if (strictMode == false) {
                $("#strictMode").css('background', 'radial-gradient(#AAA, blue)')
                strictMode = true
            } else {
                $("#strictMode").css('background', 'radial-gradient(blue, black)')
                strictMode = false
            }
        }

        function toggleOnOff() {
            // if (onButton == false){
            //   onButton = true
            //   $("#onOff").css('background', 'radial-gradient(#FF3, #AA0)')
            //   $(".pad").css('opacity', '0.4')
            //   $("#turnCount").html('--')
            // } else {
            //   onButton = false;
            //   gameStop()
            //   $("#onOff").css('background', 'radial-gradient(#550, #220)')
            //   $(".pad").css('opacity', '0.1')
            //   $("#turnCount").html(' ')
            // }
        }

        function loseGame() {
            errorSound.play()
            if (strictMode) {
                console.log('Game Over You Lose')
                $('#turnCount').html('restart')
            } else {
                console.log('retry')
                computersTurn()
            }
        }

        enum BUTTONCOLOR {
            BLUE,
            GREEN,
            RED,
            YELLOW
        }


    </script>
</head>
<body>
    <span id=output></span>

    <div id='app'>
        <div id='gamepad'>
            <div id='blue' class="pad blue" onclick='pressColor(0)'></div>
            <div id='green' class="pad green" onclick='pressColor(1)'></div>
            <div id='red' class="pad red" onclick='pressColor(2)'></div>
            <div id='yellow' class="pad yellow" onclick='pressColor(3)'></div>
            <div class='center'>
                <div id='title'>
                    <p id='simonText'>SIMON</p>
                </div>

                <div id="turnCount"></div>
                <div class='clear'></div>

                <a id='strictMode' class='buttons' onclick='toggleStrict()'><span class='buttonLabels' id='hard'>HARD</span></a>

                <a id='start' onclick='gameStart();toggleOnOff()' class='buttons'><span class='buttonLabels'>START</span></a>
                <span class='buttonLabels' id='difficulty'>DIFFICULTY</span>
                <div class="sliderContainer">
                    <input type="range" min="1" max="3" value="2" class="slider" id="difficulty" oninput='setDifficulty(value)'>
                </div>
            </div>
        </div>
    </div>
    <div>
        <button id="submit" onclick='submit()'>Submit score</button><br />
        <a id="logout" href='/auth/logout'>Logout</a>
    </div>
</body>
</html>
